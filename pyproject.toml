[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visimove-desktop"
version = "0.1.0"
description = "Windows webcam-based eye-controlled cursor system for accessibility."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "PyYAML>=6.0",
  "pyautogui>=0.9.54",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]
mediapipe = ["mediapipe>=0.10"]
eyetrax = ["scikit-learn>=1.3", "scipy>=1.10", "screeninfo>=0.8"]
mobilegaze = ["onnxruntime>=1.19"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["src/visimove/tests"]
